# tildoc stack: PostgreSQL, server (API/WebDAV/S3/SFTP), worker (OCR), nginx (TLS).
# Usage:  cp deploy/.env.example deploy/.env  (edit secrets)
#         docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: tildoc

x-tildoc-env: &tildoc-env
  TILDOC_DATABASE_URL: postgres://tildoc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/tildoc?sslmode=disable
  TILDOC_MASTER_KEY: ${TILDOC_MASTER_KEY:?set TILDOC_MASTER_KEY}
  TILDOC_PUBLIC_URL: ${TILDOC_PUBLIC_URL:-https://localhost:8443}
  TILDOC_S3_PUBLIC_URL: ${TILDOC_S3_PUBLIC_URL:-https://localhost:9443}
  TILDOC_SFTP_PUBLIC_ADDR: ${TILDOC_SFTP_PUBLIC_ADDR:-localhost:2222}
  TILDOC_S3_REGION: ${TILDOC_S3_REGION:-us-east-1}
  TILDOC_TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
  TILDOC_TRASH_RETENTION: ${TILDOC_TRASH_RETENTION:-30d}
  TILDOC_MAX_UPLOAD_BYTES: ${TILDOC_MAX_UPLOAD_BYTES:-53687091200}
  TILDOC_WORKER_CONCURRENCY: ${TILDOC_WORKER_CONCURRENCY:-2}
  TILDOC_OCR_ENABLED: ${TILDOC_OCR_ENABLED:-true}
  TILDOC_OCR_LANGS: ${TILDOC_OCR_LANGS:-deu+eng}
  TILDOC_LOG_LEVEL: ${TILDOC_LOG_LEVEL:-info}
  TILDOC_BACKUP_DIR: /backups

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tildoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tildoc
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tildoc -d tildoc"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: { context: .., target: server }
    image: tildoc-server
    restart: unless-stopped
    command: ["serve"]
    environment: *tildoc-env
    volumes:
      - data:/data
      - backups:/backups
    ports:
      - "${TILDOC_SFTP_PORT:-2222}:2222"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "tildoc", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: { context: .., target: worker }
    image: tildoc-worker
    restart: unless-stopped
    environment: *tildoc-env
    volumes:
      - data:/data
      - backups:/backups
    depends_on:
      server: { condition: service_healthy }

  nginx:
    build: { context: .., target: nginx }
    image: tildoc-nginx
    restart: unless-stopped
    environment:
      TILDOC_SERVER_NAME: ${TILDOC_SERVER_NAME:-localhost}
      TILDOC_UPSTREAM: server
    volumes:
      - certs:/etc/nginx/certs
    ports:
      - "${TILDOC_HTTPS_PORT:-8443}:443"
      - "${TILDOC_S3_PORT:-9443}:9443"
    depends_on:
      server: { condition: service_healthy }

volumes:
  pgdata:
  data:
  backups:
  certs:
